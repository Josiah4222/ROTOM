{% load static %}
{% if past_events %}
<div class="table-responsive">
    <table class="table">
        <thead>
            <tr>
                <th>Image</th>
                <th>Title</th>
                <th>Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for event in past_events %}
            <tr>
                <td>
                    {% if event.image %}
                    <img src="{{ event.image.url }}" alt="{{ event.title }}" style="width:60px; height:45px; object-fit:cover; border-radius:6px;">
                    {% else %}
                    <div style="width:60px; height:45px; background:#e2e8f0; border-radius:6px; display:flex; align-items:center; justify-content:center;">
                        <i class="fas fa-image" style="color:#a0aec0;"></i>
                    </div>
                    {% endif %}
                </td>
                <td><strong>{{ event.title }}</strong></td>
                <td>{{ event.event_date|date:"M d, Y" }}</td>
                <td>
                    <a href="{% url 'dashboard:edit_previous_event' event.pk %}" class="btn btn-sm btn-outline-primary">
                        <i class="fas fa-edit"></i>
                    </a>
                    <a href="{% url 'dashboard:delete_previous_event' event.pk %}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this past event?')">
                        <i class="fas fa-trash"></i>
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% else %}
<div class="empty-state">
    <i class="fas fa-history"></i>
    <p>No past events{% if search %} matching "{{ search }}"{% endif %}</p>
</div>
{% endif %}
