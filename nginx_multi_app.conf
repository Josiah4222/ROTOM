# Nginx Configuration for Multiple Applications
# Django (ROTOM) + ASP.NET Core on the same server

# Django Application (ROTOM Ethiopia)
server {
    listen 80;
    server_name rotomethiopia.org www.rotomethiopia.org;

    client_max_body_size 20M;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/rotom_access.log;
    error_log /var/log/nginx/rotom_error.log;

    # Static files
    location /static/ {
        alias /var/www/rotom/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files
    location /media/ {
        alias /var/www/rotom/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Proxy to Gunicorn
    location / {
        proxy_pass http://unix:/var/www/rotom/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Deny access to sensitive files
    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# ASP.NET Core Application
server {
    listen 80;
    server_name yourdotnetapp.com www.yourdotnetapp.com;  # Change to your domain

    client_max_body_size 20M;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/dotnet_access.log;
    error_log /var/log/nginx/dotnet_error.log;

    # Proxy to Kestrel (ASP.NET Core)
    location / {
        proxy_pass http://localhost:5000;  # Default Kestrel port
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts for ASP.NET
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Deny access to sensitive files
    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# If you want to host both apps on the same domain using different paths:
# Example: rotomethiopia.org (Django) and rotomethiopia.org/api (ASP.NET)
server {
    listen 80;
    server_name example-combined.com;  # Your domain

    client_max_body_size 20M;

    # Django static files
    location /static/ {
        alias /var/www/rotom/staticfiles/;
        expires 30d;
    }

    # Django media files
    location /media/ {
        alias /var/www/rotom/media/;
        expires 7d;
    }

    # ASP.NET API (or any path you choose)
    location /api/ {
        proxy_pass http://localhost:5000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django application (everything else)
    location / {
        proxy_pass http://unix:/var/www/rotom/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
