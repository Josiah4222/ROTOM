{% load static %}
<!DOCTYPE html>
<html lang="en" style="margin: 0 !important; padding: 0 !important;">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}ROTOM Ethiopia - Empowering Seniors{% endblock %}</title>

    <!-- SEO Meta Tags -->
    <meta name="description"
        content="{% block meta_description %}ROTOM Ethiopia empowers older persons and their dependents to live dignified, fulfilling lives through home-based care, center-based programs, and community support in Ethiopia.{% endblock %}">
    <meta name="keywords"
        content="ROTOM Ethiopia, elderly care, senior support, Ethiopia charity, nonprofit, Bishoftu, older persons, community care">
    <meta name="author" content="ROTOM Ethiopia">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{% block og_url %}https://rotomethiopia.org{% endblock %}">
    <meta property="og:title" content="{% block og_title %}ROTOM Ethiopia - Empowering Seniors{% endblock %}">
    <meta property="og:description"
        content="{% block og_description %}Empowering older persons and their dependents to live dignified, fulfilling lives in Ethiopia.{% endblock %}">
    <meta property="og:image" content="{% static 'images/logo.png' %}">

    <!-- Favicon -->
    <link rel="icon" href="{% static 'images/logo.png' %}" type="image/png">
    <link rel="apple-touch-icon" href="{% static 'images/logo.png' %}">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"></noscript>

    {% block hero_preload %}{% endblock %}

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" 
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer"></noscript>

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/animations.css' %}">
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}?v=3">
    <link rel="stylesheet" href="{% static 'css/footer.css' %}">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">

    {% block extra_css %}{% endblock %}
    
    <style>
        /* ── Language switching ───────────────────────────── */
        .lang-am { display: none; }

        html[data-lang="am"] .lang-en { display: none; }
        html[data-lang="am"] .lang-am { display: inline; }

        /* Block-level elements (p, div, h*) need block not inline */
        html[data-lang="am"] .lang-am.lang-block { display: block; }
        /* Force remove any gaps at the top */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            position: relative;
        }
        body {
            padding-top: 0 !important;
        }

        /* Hero & Image Fast Smooth Fade-In */
        @keyframes heroFadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes heroFadeUp {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Target all hero-like sections */
        .hero, 
        .event-hero, 
        .take-action-hero, 
        .success-hero, 
        .journey-hero,
        .blog-hero-bg,
        .event-hero-bg {
            animation: heroFadeIn 0.8s ease-in-out;
            will-change: opacity;
        }
        
        /* Hero backgrounds and images */
        .hero-background,
        .hero-bg-img,
        .hero img,
        .event-hero img,
        .event-hero-background,
        .event-hero-bg img,
        .blog-hero-bg img {
            animation: heroFadeIn 0.8s ease-in-out;
            will-change: opacity;
        }
        
        /* Hero content with slide-up effect */
        .hero-content, 
        .event-hero-content, 
        .take-action-hero-content, 
        .hero-content-wrapper,
        .success-hero-content {
            animation: heroFadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
            will-change: opacity, transform;
        }
    </style>
</head>

<body style="margin: 0 !important; padding: 0 !important;">
    <!-- PAGE CONTENT -->
    <main class="main-content-wrapper" style="margin-top: 0 !important; padding-top: 0 !important;">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Global Animation Script -->
    <script src="{% static 'js/animations.js' %}" defer></script>

    {% block extra_js %}{% endblock %}

    {% if not request.user.is_staff %}
    <script>
    (function() {
        var lastChecked = null;
        setInterval(function() {
            fetch('/content-check/')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.updated_at) {
                        if (lastChecked && lastChecked !== data.updated_at) {
                            location.reload();
                        }
                        lastChecked = data.updated_at;
                    }
                })
                .catch(function() {});
        }, 5000);
    })();
    </script>
    {% endif %}
</body>

</html>
