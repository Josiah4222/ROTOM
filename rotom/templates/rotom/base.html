{% load static %}
<!DOCTYPE html>
<html lang="en" style="margin: 0 !important; padding: 0 !important;">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ROTOM Ethiopia - Empowering Seniors{% endblock %}</title>

    <!-- SEO Meta Tags -->
    <meta name="description"
        content="{% block meta_description %}ROTOM Ethiopia empowers older persons and their dependents to live dignified, fulfilling lives through home-based care, center-based programs, and community support in Ethiopia.{% endblock %}">
    <meta name="keywords"
        content="ROTOM Ethiopia, elderly care, senior support, Ethiopia charity, nonprofit, Bishoftu, older persons, community care">
    <meta name="author" content="ROTOM Ethiopia">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{% block og_url %}https://rotomethiopia.org{% endblock %}">
    <meta property="og:title" content="{% block og_title %}ROTOM Ethiopia - Empowering Seniors{% endblock %}">
    <meta property="og:description"
        content="{% block og_description %}Empowering older persons and their dependents to live dignified, fulfilling lives in Ethiopia.{% endblock %}">
    <meta property="og:image" content="{% static 'images/logo.png' %}">

    <!-- Favicon -->
    <link rel="icon" href="{% static 'images/logo.png' %}" type="image/png">
    <link rel="apple-touch-icon" href="{% static 'images/logo.png' %}">

    <!-- Fonts - Load with swap for better performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Preload critical CSS -->
    <link rel="preload" href="{% static 'css/navbar.css' %}" as="style">
    <link rel="preload" href="{% static 'css/footer.css' %}" as="style">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" 
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" 
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- CSS Files -->
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}">
    <link rel="stylesheet" href="{% static 'css/footer.css' %}">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">

    {% block extra_css %}{% endblock %}
    
    <style>
        /* Force remove any gaps at the top */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            position: relative;
        }
        body {
            padding-top: 0 !important;
        }

        /* Hero Image Smooth Fade-In */
        .hero {
            background-color: #1C651B;
        }
        
        .hero::before,
        .hero .hero-background,
        .hero-background {
            animation: heroFadeIn 0.8s ease-in-out;
        }

        @keyframes heroFadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        /* Ensure hero images load smoothly */
        .hero[style*="background-image"],
        .hero .hero-background[style*="background-image"] {
            background-color: #1C651B;
            transition: opacity 0.3s ease-in-out;
        }
    </style>
</head>

<body style="margin: 0 !important; padding: 0 !important;">
    <!-- PAGE CONTENT -->
    <main class="main-content-wrapper" style="margin-top: 0 !important; padding-top: 0 !important;">
        {% block content %}
        {% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
</body>

</html>
