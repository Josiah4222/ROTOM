{% load static %}
<!DOCTYPE html>
<html lang="en" style="margin: 0 !important; padding: 0 !important;">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}ROTOM Ethiopia - Empowering Seniors{% endblock %}</title>

    <!-- SEO Meta Tags -->
    <meta name="description"
        content="{% block meta_description %}ROTOM Ethiopia empowers older persons and their dependents to live dignified, fulfilling lives through home-based care, center-based programs, and community support in Ethiopia.{% endblock %}">
    <meta name="keywords"
        content="ROTOM Ethiopia, elderly care, senior support, Ethiopia charity, nonprofit, Bishoftu, older persons, community care">
    <meta name="author" content="ROTOM Ethiopia">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{% block og_url %}https://rotomethiopia.org{% endblock %}">
    <meta property="og:title" content="{% block og_title %}ROTOM Ethiopia - Empowering Seniors{% endblock %}">
    <meta property="og:description"
        content="{% block og_description %}Empowering older persons and their dependents to live dignified, fulfilling lives in Ethiopia.{% endblock %}">
    <meta property="og:image" content="{% static 'images/logo.png' %}">

    <!-- Favicon -->
    <link rel="icon" href="{% static 'images/logo.png' %}" type="image/png">
    <link rel="apple-touch-icon" href="{% static 'images/logo.png' %}">

    <!-- Fonts - Preconnect + preload for fast rendering -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"></noscript>

    {% block hero_preload %}{% endblock %}

    <!-- Font Awesome - non-blocking -->
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" 
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer"></noscript>

    <!-- CSS - non-blocking via preload -->
    <link rel="preload" href="{% static 'css/animations.css' %}" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="{% static 'css/animations.css' %}"></noscript>
    <link rel="preload" href="{% static 'css/navbar.css' %}?v=2" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="{% static 'css/navbar.css' %}?v=2"></noscript>
    <link rel="preload" href="{% static 'css/footer.css' %}" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="{% static 'css/footer.css' %}"></noscript>
    <link rel="preload" href="{% static 'css/responsive.css' %}" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="{% static 'css/responsive.css' %}"></noscript>

    {% block extra_css %}{% endblock %}
    
    <style>
        /* Force remove any gaps at the top */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            position: relative;
        }
        body {
            padding-top: 0 !important;
        }

        /* Hero & Image Fast Smooth Fade-In */
        @keyframes heroFadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes heroFadeUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .hero, .event-hero, .take-action-hero, .success-hero {
            background-color: #1C651B;
            animation: heroFadeIn 0.35s ease-out;
            will-change: opacity;
        }
        
        .hero-background,
        .event-hero img,
        .event-hero-background {
            animation: heroFadeIn 0.35s ease-out;
            will-change: opacity;
        }
        
        .hero-content, .event-hero-content, .take-action-hero-content {
            animation: heroFadeUp 0.4s ease-out 0.1s both;
            will-change: opacity, transform;
        }

        .hero img, .event-hero img, .hero-background img {
            animation: heroFadeIn 0.35s ease-out;
        }
    </style>
</head>

<body style="margin: 0 !important; padding: 0 !important;">
    <!-- PAGE CONTENT -->
    <main class="main-content-wrapper" style="margin-top: 0 !important; padding-top: 0 !important;">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Global Animation Script -->
    <script src="{% static 'js/animations.js' %}" defer></script>

    {% block extra_js %}{% endblock %}
</body>

</html>
