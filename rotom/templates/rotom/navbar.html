{% load static %}

<!-- Ethiopian Pattern Bar -->
<div class="top-pattern"></div>

<!-- Navbar -->
<nav class="navbar" id="mainNavbar">
    <a href="{% url 'home' %}" class="navbar-brand">
        <img src="{% static 'images/logo.png' %}" alt="ROTOM Logo">
        <div class="brand-text">
            <span class="brand-name">ROTOM Ethiopia</span>
            <span class="brand-tagline">Reach One Touch One</span>
        </div>
    </a>

    <ul class="navbar-nav">
        <li><a href="{% url 'home' %}">Home</a></li>
        <li><a href="{% url 'ourstory' %}">About Us</a></li>
        <li><a href="{% url 'stories' %}">Stories</a></li>
        <li><a href="{% url 'blog' %}">Blog</a></li>
        <li><a href="{% url 'take_action' %}">Take Action</a></li>
        <li><a href="{% url 'events' %}">Events</a></li>
        <li><a href="{% url 'donate' %}" class="donate-btn"><span>Donate</span></a></li>
    </ul>

    <button class="menu-toggle" aria-label="Toggle Menu" aria-expanded="false">
        <svg class="menu-icon" viewBox="0 0 24 24">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
        </svg>
        <svg class="close-icon" style="display: none;" viewBox="0 0 24 24">
            <path
                d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
        </svg>
    </button>
</nav>

<!-- Mobile Backdrop -->
<div class="menu-backdrop"></div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const navbar = document.getElementById('mainNavbar');
        const menuToggle = document.querySelector('.navbar .menu-toggle');
        const nav = document.querySelector('.navbar-nav');
        const backdrop = document.querySelector('.menu-backdrop');
        const menuIcon = document.querySelector('.menu-toggle .menu-icon');
        const closeIcon = document.querySelector('.menu-toggle .close-icon');

        // Scroll effect for navbar
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                if (navbar) navbar.classList.add('scrolled');
            } else {
                if (navbar) navbar.classList.remove('scrolled');
            }
        }, { passive: true });

        if (!menuToggle || !nav || !backdrop || !menuIcon || !closeIcon) return;

        const toggleMenu = () => {
            menuToggle.classList.toggle('active');
            nav.classList.toggle('active');
            backdrop.classList.toggle('active');
            const expanded = menuToggle.classList.contains('active');
            menuIcon.style.display = expanded ? 'none' : 'block';
            closeIcon.style.display = expanded ? 'block' : 'none';
            menuToggle.setAttribute('aria-expanded', expanded);
            document.body.style.overflow = expanded ? 'hidden' : '';
        };

        menuToggle.addEventListener('click', toggleMenu);

        backdrop.addEventListener('click', () => {
            menuToggle.classList.remove('active');
            nav.classList.remove('active');
            backdrop.classList.remove('active');
            menuIcon.style.display = 'block';
            closeIcon.style.display = 'none';
            menuToggle.setAttribute('aria-expanded', false);
            document.body.style.overflow = '';
        });

        document.querySelectorAll('.navbar-nav a').forEach(link => {
            link.addEventListener('click', () => {
                menuToggle.classList.remove('active');
                nav.classList.remove('active');
                backdrop.classList.remove('active');
                menuIcon.style.display = 'block';
                closeIcon.style.display = 'none';
                menuToggle.setAttribute('aria-expanded', false);
                document.body.style.overflow = '';
            });
        });
    });
</script>
